<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --navy: #003366;
            --navy-deep: #002347;
            --blue: #0066cc;
            --light-blue: #4da3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== TOP NAVBAR ===== */

        .navbar {
            background: var(--navy);
            color: white;
            padding: 16px clamp(18px, 4vw, 30px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 14px rgba(0, 20, 50, .18);
        }

        .navbar .brand {
            font-family: "Sora", sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
        }

        .brand .logo-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--light-blue), var(--blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .logout {
            background: white;
            border: 1px solid rgba(255, 255, 255, .16);
            color: black;
            text-decoration: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            transition: background .2s ease;
            white-space: nowrap;
        }

        .logout:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* ===== MOBILE ===== */

        @media (max-width: 480px) {
            .navbar .brand {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="navbar">

   <div class="brand" style="display:flex;align-items:center;gap:10px;">
    <img src="../assets/cot-logo.jpeg" alt="College of Technology, University of Buea" style="width:36px;height:36px;object-fit:contain;">
    <span style="color:#fff;">COT-<span style="color:#7fbaff;">Result</span></span>
</div>

    <a class="logout" href="../logout.php">
        Logout
    </a>

</div>

</body>
</html>
